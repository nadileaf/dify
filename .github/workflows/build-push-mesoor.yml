name: Build and Push Mesoor Branch

on:
  push:
    branches:
      - mesoor

env:
  REGISTRY: cr.mesoor.com
  IMAGE_NAME: production/dify-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        working-directory: web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Get short commit hash
        id: get_hash
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "Commit hash: ${SHORT_HASH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CR_MESOOR_USERNAME }}
          password: ${{ secrets.CR_MESOOR_PASSWORD }}

      - name: Build Docker image
        working-directory: web
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}"
          echo "Building image: ${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg COMMIT_SHA=${{ steps.get_hash.outputs.hash }} \
            --tag ${IMAGE_TAG} \
            --load \
            .

      - name: Push Docker image with retry
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=30
          
          push_image() {
            echo "Pushing image: ${IMAGE_TAG}"
            docker push ${IMAGE_TAG}
          }
          
          for i in $(seq 1 ${MAX_RETRIES}); do
            echo "Attempt ${i}/${MAX_RETRIES}..."
            if push_image; then
              echo "Successfully pushed image on attempt ${i}"
              exit 0
            else
              if [ ${i} -lt ${MAX_RETRIES} ]; then
                echo "Push failed, waiting ${RETRY_DELAY} seconds before retry..."
                sleep ${RETRY_DELAY}
              else
                echo "Push failed after ${MAX_RETRIES} attempts"
                exit 1
              fi
            fi
          done

      - name: Image info
        run: |
          echo "Successfully built and pushed:"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}"

