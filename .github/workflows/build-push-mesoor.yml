name: Build and Push Mesoor Branch

on:
  push:
    branches:
      - mesoor

env:
  GHCR_REGISTRY: ghcr.io
  MESOOR_REGISTRY: cr.mesoor.com
  IMAGE_NAME: production/dify-api
  GITHUB_IMAGE_NAME: ${{ github.repository_owner }}/dify-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from pyproject.toml
        id: get_version
        working-directory: api
        run: |
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "::notice::📦 Version: ${VERSION}"

      - name: Get short commit hash
        id: get_hash
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "::notice::🔖 Commit: ${SHORT_HASH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        timeout-minutes: 20
        working-directory: api
        env:
          GHCR_IMAGE_TAG: ${{ env.GHCR_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}
          MESOOR_IMAGE_TAG: ${{ env.MESOOR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}
        run: |
          echo "::group::Docker Build Process"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg COMMIT_SHA=${{ steps.get_hash.outputs.hash }} \
            --tag ${GHCR_IMAGE_TAG} \
            --push \
            --progress=plain \
            --provenance=false \
            --sbom=false \
            .
          echo "::endgroup::"
          
          echo ""
          echo "镜像已推送到 GHCR，请使用以下命令同步到腾讯云："
          echo ""
          echo "::notice file=sync-command,title=同步命令::./scripts/sync-image-to-mesoor.sh ${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}"
          echo ""
          echo "或者手动同步："
          echo "::notice file=manual-sync,line=1::docker pull ${GHCR_IMAGE_TAG}"
          echo "::notice file=manual-sync,line=2::docker tag ${GHCR_IMAGE_TAG} ${MESOOR_IMAGE_TAG}"
          echo "::notice file=manual-sync,line=3::docker push ${MESOOR_IMAGE_TAG}"


