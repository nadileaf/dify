name: Build and Push Mesoor Branch

on:
  push:
    branches:
      - mesoor

env:
  REGISTRY: cr.mesoor.com
  IMAGE_NAME: production/dify-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        working-directory: web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Get short commit hash
        id: get_hash
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "Commit hash: ${SHORT_HASH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CR_MESOOR_USERNAME }}
          password: ${{ secrets.CR_MESOOR_PASSWORD }}

      - name: Build and Push Docker image with retry
        timeout-minutes: 30
        working-directory: web
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=60
          
          for i in $(seq 1 ${MAX_RETRIES}); do
            echo "=== Attempt ${i}/${MAX_RETRIES} ==="
            echo "Building and pushing image: ${IMAGE_TAG}"
            
            if docker buildx build \
              --platform linux/amd64 \
              --build-arg COMMIT_SHA=${{ steps.get_hash.outputs.hash }} \
              --tag ${IMAGE_TAG} \
              --push \
              --progress=plain \
              --provenance=false \
              --sbom=false \
              .; then
              echo "✓ Successfully built and pushed image on attempt ${i}"
              exit 0
            else
              EXIT_CODE=$?
              if [ ${i} -lt ${MAX_RETRIES} ]; then
                echo "✗ Build/Push failed with exit code ${EXIT_CODE}"
                echo "Waiting ${RETRY_DELAY} seconds before retry..."
                sleep ${RETRY_DELAY}
              else
                echo "✗ Build/Push failed after ${MAX_RETRIES} attempts"
                exit 1
              fi
            fi
          done

      - name: Image info
        run: |
          echo "Successfully built and pushed:"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ steps.get_hash.outputs.hash }}"

